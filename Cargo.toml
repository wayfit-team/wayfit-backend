[package]
name = "wayfit-backend"
version = "0.1.0"
edition = "2021"
description = "WayFit (웨이핏) Cloudflare Workers + D1 Backend API (Rust)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
worker = { version = "0.7", features = ["http", "d1", "axum"] }
axum = { version = "0.8", default-features = false, features = ["json", "query", "macros"] }
tower-service = "0.3"
http = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "5" }
getrandom = { version = "0.2", features = ["js"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
uuid = { version = "1.10", features = ["v4", "js", "serde"] }
thiserror = "2.0"
