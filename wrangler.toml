name = "wayfit-backend"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-29"

[build]
command = "cargo install -q worker-build --version ~0.7 && worker-build --release"

[[d1_databases]]
binding = "wayfit_db"
database_name = "wayfit-db"
database_id = "4b314bd5-d613-4acd-bef4-b0b597bfdcf2"
migrations_dir = "migrations"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

[vars]
KAKAO_REST_API_KEY = "9ab09a604f5cd454900647e5921b830f"
# wayfit.pages.dev 는 우리 앱이 아니라 제3자 사이트다. 운영 PWA 도메인이 정해지면 채운다.
# 비어 있으면 카카오 로그인(KAKAO_REDIRECT_URIS)과 차량 QR 발급(PWA_BASE_URL)이 거절된다.
KAKAO_REDIRECT_URIS = ""
PWA_BASE_URL = ""
