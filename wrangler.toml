name = "wayfit-backend"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-29"

[build]
command = "cargo install -q worker-build --version ~0.7 && worker-build --release"

[[d1_databases]]
binding = "wayfit_db"
database_name = "wayfit-db"
database_id = "4b314bd5-d613-4acd-bef4-b0b597bfdcf2"
migrations_dir = "migrations"

[vars]
# 카카오 개발자 콘솔 > 앱 > 앱 키 > REST API 키 (인가 요청 client_id, 공개값)
KAKAO_REST_API_KEY = ""
# 카카오 콘솔 > 카카오 로그인 > Redirect URI 에 등록한 값과 정확히 같아야 한다 (쉼표 구분)
KAKAO_REDIRECT_URIS = "https://wayfit.pages.dev/auth/kakao/callback"
# Client Secret 은 vars 가 아니라 시크릿으로: npx wrangler secret put KAKAO_CLIENT_SECRET
