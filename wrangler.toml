name = "wayfit-backend"
main = "build/worker/shim.mjs"
compatibility_date = "2026-10-29"

[build]
command = "bash ./scripts/build-worker.sh"

[[d1_databases]]
binding = "wayfit_db"
database_name = "wayfit-db"
database_id = "4b314bd5-d613-4acd-bef4-b0b597bfdcf2"
migrations_dir = "migrations"

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true

[vars]
KAKAO_REST_API_KEY = "9ab09a604f5cd454900647e5921b830f"
KAKAO_REDIRECT_URIS = "https://wayfit-pwa.pages.dev/auth/kakao/callback,http://localhost:5173/auth/kakao/callback"
PWA_BASE_URL = "https://wayfit-pwa.pages.dev"
